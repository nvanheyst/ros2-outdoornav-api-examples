name: docker

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-build-and-test-fork:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build local test image
        run: docker build -t onav-api-examples:ci ./docker
      - name: Run offline smoke in container
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo onav-api-examples:ci bash -lc "./scripts/smoke_all.sh"
      - name: Run scenario smoke in container
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo onav-api-examples:ci bash -lc "./scripts/scenario_smoke.sh"

  pr-build-test-and-push-temp:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build local test image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          load: true
          tags: onav-api-examples:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run offline smoke in container
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo onav-api-examples:ci bash -lc "./scripts/smoke_all.sh"
      - name: Run scenario smoke in container
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo onav-api-examples:ci bash -lc "./scripts/scenario_smoke.sh"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push temporary PR image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/nvanheyst/onav-api-examples:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-pr-image:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete temporary PR image tag
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const packageName = "onav-api-examples";
            const tag = `pr-${context.payload.pull_request.number}`;
            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
              {
                username: owner,
                package_type: "container",
                package_name: packageName,
                per_page: 100
              }
            );
            const matches = versions.filter(v => (v.metadata?.container?.tags || []).includes(tag));
            if (matches.length === 0) {
              core.info(`No image version found for tag ${tag}`);
              return;
            }
            for (const v of matches) {
              await github.rest.packages.deletePackageVersionForUser({
                username: owner,
                package_type: "container",
                package_name: packageName,
                package_version_id: v.id
              });
              core.info(`Deleted package version ${v.id} for tag ${tag}`);
            }

  main-build-test-and-push-latest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build local test image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          load: true
          tags: onav-api-examples:ci
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run offline smoke in container
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo onav-api-examples:ci bash -lc "./scripts/smoke_all.sh"
      - name: Run scenario smoke in container
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo onav-api-examples:ci bash -lc "./scripts/scenario_smoke.sh"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push latest image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/nvanheyst/onav-api-examples:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
