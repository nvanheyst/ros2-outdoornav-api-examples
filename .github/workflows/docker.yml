name: build-and-push

# Rebuild the dev image on every push to main and overwrite :latest in GHCR.
# Only :latest is ever published — no version tags.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Multi-arch so the image runs on both amd64 desktops and arm64 Jetsons.
      # QEMU adds build time but keeps the image portable.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/nvanheyst/onav-api-examples:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
